<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QC Inspector</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>QC Inspector</b></div>
  <nav role="tablist" aria-label="Pages">
    <button role="tab" data-page="inspect">Inspect</button>
    <button role="tab" data-page="log">Inspection log <span class="count" id="open-count" hidden></span></button>
    <button role="tab" data-page="analytics">Analytics</button>
    <button role="tab" data-page="system">System</button>
  </nav>
  <div class="status">
    <span class="pill" id="net-pill"></span>
    <span class="pill" id="llm-pill"></span>
    <label class="line-pick">Line <select id="line"></select></label>
  </div>
</header>
<div class="alert" id="alert" role="alert" hidden></div>

<main id="page-inspect" class="page" hidden>
  <section class="kpis" id="kpis" aria-label="This session"></section>
  <div class="cols">
    <section class="panel viewer">
      <div class="view-wrap">
        <img id="view" alt="live inspection view">
        <div class="view-msg" id="view-msg" hidden></div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="play" aria-label="pause or play"></button>
        <button class="btn" id="step">Next unit</button>
        <button class="btn primary" id="inspect-now" hidden>Inspect now</button>
        <label class="pace" id="pace-wrap">Pace <input type="range" id="pace" min="0" max="6" step="1"> <span id="pace-val"></span></label>
        <span class="grow"></span>
        <span class="muted" id="view-info"></span>
      </div>
      <div class="strip" id="strip" aria-label="latest units"></div>
    </section>
    <section class="side">
      <div class="panel verdict" id="verdict">
        <div class="v-word" id="v-word">Waiting</div>
        <div class="v-why" id="v-why"></div>
        <div class="v-meta"><span id="v-unit"></span><span id="v-label"></span></div>
      </div>
      <div class="panel" id="parts-panel" hidden>
        <h2>Parts in view</h2>
        <div class="parts" id="parts"></div>
      </div>
      <div class="panel">
        <h2>Findings</h2>
        <div id="findings"></div>
      </div>
      <div class="panel">
        <h2>Advice from Llama <span class="muted" id="adv-unit"></span></h2>
        <div id="advice"></div>
      </div>
    </section>
  </div>
</main>

<main id="page-log" class="page" hidden>
  <form class="panel filters" id="filters">
    <div class="chips" id="f-results" role="group" aria-label="Result"></div>
    <label>Line <select name="profile"></select></label>
    <label>Defect <select name="defect"></select></label>
    <label>Decision <select name="decision"></select></label>
    <label>Against labels <select name="gt_outcome">
      <option value="">any</option><option value="ok">agrees</option><option value="escape">missed defect</option><option value="false_reject">false reject</option>
    </select></label>
    <label>Session <select name="session"></select></label>
    <label>From <input type="date" name="from"></label>
    <label>To <input type="date" name="to"></label>
    <label class="grow">Search <input type="search" name="q" placeholder="unit, file, advice or note"></label>
    <button type="button" class="btn" id="f-clear">Clear</button>
    <a class="btn" id="f-csv" download>Export CSV</a>
  </form>
  <section class="panel tight">
    <div class="log-head"><b id="log-total"></b><span id="log-mix"></span><span class="grow"></span><label class="muted"><input type="checkbox" id="log-auto" checked> update live</label></div>
    <div class="table-wrap">
      <table class="log">
        <thead><tr><th></th><th>Unit</th><th>Line</th><th>Result</th><th>Findings</th><th>Labels</th><th>Advice</th><th>Decision</th><th class="num">Vision</th></tr></thead>
        <tbody id="log-rows"></tbody>
      </table>
    </div>
    <div class="pager"><button class="btn" id="p-new">Newer</button><span class="muted" id="p-pos"></span><button class="btn" id="p-old">Older</button></div>
  </section>
</main>

<main id="page-analytics" class="page" hidden>
  <form class="panel filters" id="a-filters">
    <label>Line <select name="profile"></select></label>
    <label>Session <select name="session"></select></label>
    <span class="grow"></span>
    <button type="button" class="btn primary" id="summary-btn">Ask Llama for a shift summary</button>
  </form>
  <section class="panel" id="summary" hidden></section>
  <section class="kpis" id="a-kpis"></section>
  <div class="grid2">
    <section class="panel"><h2>Results over time</h2><div id="a-trend"></div></section>
    <section class="panel"><h2>Defects by type</h2><div id="a-defects"></div></section>
    <section class="panel"><h2>Verdicts against the dataset's labels</h2><div id="a-labels"></div></section>
    <section class="panel"><h2>Where defects occur</h2><div id="a-zones"></div></section>
    <section class="panel"><h2>Llama advice</h2><div id="a-advice"></div></section>
    <section class="panel"><h2>Operator decisions</h2><div id="a-decisions"></div></section>
  </div>
</main>

<main id="page-system" class="page" hidden>
  <section class="kpis" id="s-kpis"></section>
  <div class="grid2" id="s-charts"></div>
  <section class="panel"><h2>Runtimes</h2><div id="s-info"></div></section>
</main>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="tip" id="tip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
