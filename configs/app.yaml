# Runtime configuration. Any key can be overridden from the CLI:
#   python -m qc run --set vision.backend=groundtruth --set source.path=data/demo/pcb
profile: pcb                      # -> configs/profiles/<profile>.yaml
lines: [tray, metal_parts, steel_sheet, pcb, mvtec_fasteners]   # inspection lines offered on the site

source:
  type: folder                    # folder (simulated conveyor) | video | camera
  path: data/demo/{profile}/images
  shuffle: true
  loop: true
  inspect: true                   # false: only show the live camera on the site (no detector, no Llama)
  fps_limit: 4                    # conveyor pace in units/s; 0 = as fast as possible
  camera:
    kind: usb                     # usb | csi
    index: 0
    width: 1280
    height: 720
    fps: 30
    props: ""                     # extra nvarguscamerasrc properties, e.g. "aelock=true awblock=true"
    crop: none                    # none | square (use the same setting for capture, live test and the demo)
    trigger: none                 # none: every frame | stable: one part at rest (pixels) | parts: tray of parts at rest
    trigger_params: {change: 8.0, still: 2.0, frames: 5}   # mean grey-level differences; tune on the rig
    reconnect_s: 10               # keep retrying a lost camera this long

vision:
  kind: defects                   # defects: the model finds defects | tray: it finds parts, each is then checked
  backend: tensorrt               # tensorrt | onnxruntime | torch | groundtruth (dev only: reads label files)
  weights_dir: models/vision/{profile}
  imgsz: 640
  conf: 0.25
  use_class_conf: true            # apply the profile's class_conf (false = vision.conf for every class)
  anomaly: false                  # true: also send parts unlike the good ones to REVIEW | only: without YOLO
  iou: 0.5
  half: true
  device: 0

advisory:
  enabled: true
  backend: executorch             # executorch | template (deterministic SOP text, used as fallback too)
  submit_when: [FAIL, REVIEW, PASS_WITH_NOTE]
  queue_size: 8
  prioritise: true                # when the queue is full drop PASS_WITH_NOTE, then REVIEW, then FAIL (oldest first)
  compact_record: false           # group repeated defects and omit the rule trace (shorter prompt; A/B on the board)
  retries: 1
  temperature: 0.2
  executorch:
    mode: server                  # server: persistent qc_llm_server (model loaded once) | oneshot: llama_main per call
    server: third_party/executorch/cmake-out/examples/models/llama/qc_llm_server
    server_log: runs/logs/llm_server.log
    runner: third_party/executorch/cmake-out/examples/models/llama/llama_main
    model: models/llm/llama3_2_1b_instruct_8da4w.pte
    tokenizer: models/llm/tokenizer.model
    max_new_tokens: 256           # advice JSON is ~110-200 tokens; loops are cut early by the server
    seq_len: 1536                 # oneshot only (prompt + output)
    cpu_threads: 4                # of 6 A78AE cores; vision runs on the GPU
    warmup: true
    start_timeout_s: 120
    timeout_s: 180
    # oneshot mode: argument template for llama_main (check `llama_main --help` for the pinned release)
    args:
      - "--model_path={model}"
      - "--tokenizer_path={tokenizer}"
      - "--prompt={prompt}"
      - "--temperature={temperature}"
      - "--seq_len={seq_len}"
      - "--cpu_threads={cpu_threads}"

logging:
  db: runs/inspections.db
  save_frames: defective          # all | defective | none
  frames_dir: runs/frames
  context_window: 50              # units of history passed to Llama as context

server:
  host: 0.0.0.0
  allow: ["127.0.0.0/8", "192.168.55.0/24"]   # who may open the site: the board itself and the USB-C link ([] = anyone)
  port: 8000
  stream_fps: 12
