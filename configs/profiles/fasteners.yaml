# DRAFT profile for live-camera inspection of nuts, bolts and screws.
# Classes, thresholds and SOP text are placeholders until the domain is decided
# and a labelled dataset exists (see training/capture_images.py).
name: fasteners
title: fastener (nut / bolt / screw) visual inspection
station: QC-CAM-1
dataset: TBD - own captures (training/capture_images.py) labelled in CVAT / Label Studio

classes: [crack, thread_damage, deformation, head_damage, rust]

# null -> sizes are measured as a fraction of the frame area instead of mm^2.
# Set this after calibrating the camera at a fixed working distance.
px_per_mm: null
zones: {rows: 3, cols: 3}

severity:
  confidence_review_below: 0.40
  size_thresholds:                 # fraction of frame area [P33, P66]
    deformation: [0.002, 0.010]
    head_damage: [0.002, 0.010]
    rust:        [0.005, 0.030]
  classes:
    crack:         {base: high}
    thread_damage: {base: high}
    deformation:   {base: medium, size_rule: three_level}
    head_damage:   {base: medium, size_rule: three_level}
    rust:          {base: low,    size_rule: escalate_only}

decision:
  fail_if_any: high
  fail_if_medium_count_at_least: 2
  review_if_medium_count_at_least: 1

mention_patterns:
  thread_damage: ["thread damage", "damaged thread", "stripped thread", "thread_damage"]
  head_damage: ["head damage", "damaged head", "head_damage", "cam-out"]

sop:
  crack:
    meaning: visible crack in the part body or head
    causes: [over-heading during cold forming, quench cracking in heat treatment, material inclusions]
    actions: [quarantine the lot, check heat-treatment records, run a magnetic-particle check on samples]
  thread_damage:
    meaning: stripped, flattened or missing threads
    causes: [worn thread-rolling dies, handling impact, mis-fed blanks]
    actions: [inspect thread-rolling dies, gauge samples with GO/NO-GO gauges, check conveyor drop heights]
  deformation:
    meaning: bent shank or out-of-shape body
    causes: [feeder jam, impact in handling, incorrect forming load]
    actions: [check feeder and chutes, verify forming press settings]
  head_damage:
    meaning: damaged drive recess or head edge
    causes: [worn punch, burrs from trimming, handling impact]
    actions: [inspect punch and trim tooling, check deburring step]
  rust:
    meaning: surface corrosion
    causes: [inadequate plating or oiling, humid storage]
    actions: [check plating thickness and oil coverage, review storage humidity]
