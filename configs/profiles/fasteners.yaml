# Live-camera inspection of bolts (Phase 2). No trained model yet: capture, label and train first
# (docs/fasteners_live.md). Severity policy and SOP text are engineering defaults, not a standard.
name: fasteners
title: bolt visual inspection
station: QC-CAM-1
dataset: own captures (training/capture_images.py), split by physical part (training/prepare_fasteners.py)

# Order = YOLO class ids; keep the labelling tool's class list identical.
classes: [thread_damage, deformation, rust]

px_per_mm: null                    # null: sizes are a fraction of the frame area; set for a calibrated fixed rig
zones: {rows: 3, cols: 3}

# Bolts lie at any angle, unlike PCB scans. Mild colour jitter only: rust is a colour defect.
augmentation: {degrees: 180.0, hsv_h: 0.01, hsv_s: 0.3, hsv_v: 0.4}

severity:
  confidence_review_below: 0.40
  size_thresholds:                 # placeholders until training/calibrate_severity.py --profile fasteners
    deformation: [0.002, 0.010]
    rust:        [0.005, 0.030]
  classes:
    thread_damage: {base: high}
    deformation:   {base: medium, size_rule: three_level}
    rust:          {base: low,    size_rule: escalate_only}

decision:
  fail_if_any: high
  fail_if_medium_count_at_least: 2
  review_if_medium_count_at_least: 1

mention_patterns:
  thread_damage: ["thread damage", "damaged thread", "stripped thread", "thread_damage"]
  deformation: ["deformation", "deformed", "bent shank"]
  rust: ["rust", "corrosion", "corroded"]

sop:
  thread_damage:
    meaning: stripped, flattened or missing threads
    causes: [worn thread-rolling dies, handling impact, mis-fed blanks]
    actions: [inspect thread-rolling dies, gauge samples with GO/NO-GO gauges, check conveyor drop heights]
  deformation:
    meaning: bent shank or out-of-shape body
    causes: [feeder jam, impact in handling, incorrect forming load]
    actions: [check feeder and chutes, verify forming press settings]
  rust:
    meaning: surface corrosion
    causes: [inadequate plating or oiling, humid storage]
    actions: [check plating thickness and oil coverage, review storage humidity]
